[project]
name = "boekhouding"
version = "0.1.0"
description = "XAF auditfile explorer and CAMT.053 conversion tools"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "fastapi>=0.138.0",
    "uvicorn[standard]>=0.49.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.28.1",
]

[project.scripts]
boekhouding = "boekhouding.cli:main"

[tool.uv]
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boekhouding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
